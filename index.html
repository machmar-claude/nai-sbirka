<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAI · sbírka se přestěhovala</title>
<meta name="robots" content="noindex">
<script>
/* NAI moved to machmar.github.io/sbirka/nai/. Saved progress lives per address, so it is handed over in the hash
   (#mig=…, never sent to a server); the new page takes it only if it has nothing saved yet. #p2-1 and ?room= carry over. */
(function () {
  var to = "https://machmar.github.io/sbirka/nai/" + location.search, go = location.hash.slice(1), h = [];
  try {
    var d = localStorage.getItem("nai-sbirka-v1");
    if (d) h.push("mig=" + encodeURIComponent(btoa(unescape(encodeURIComponent(d)))));
  } catch (e) {}
  if (go) h.push("go=" + encodeURIComponent(go));
  location.replace(to + (h.length ? "#" + h.join("&") : ""));
})();
</script>
</head>
<body>
<p>NAI · sbírka je nově na <a href="https://machmar.github.io/sbirka/nai/">machmar.github.io/sbirka/nai</a>.</p>
</body>
</html>
